name: client
description: Cliente Flutter para streaming en LAN.
publish_to: none
version: 0.1.9+16
environment:
  sdk: ^3.3.0
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  web_socket_channel: ^3.0.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  crypto: ^3.0.3
  shared:
    path: ../packages/shared
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  video_player: ^2.9.2
  youtube_explode_dart: ^3.1.0
  flutter_webrtc: ^1.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon_fg.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_fg.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
    - assets/video/
  
